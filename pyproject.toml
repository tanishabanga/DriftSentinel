[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driftsentinel"
version = "0.1.0"
description = "A temporal fraud intelligence and adaptive decision platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "xgboost",
    "pyyaml",
    "pydantic"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "jupyter",
    "ipykernel",
    "pyarrow",
    "psutil"
]

api = [
    "fastapi",
    "uvicorn[standard]",
    "httpx"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"